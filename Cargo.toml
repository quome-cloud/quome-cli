[package]
name = "quome-cli"
version = "0.2.43"
edition = "2021"
description = "CLI for the Quome platform"
license = "MIT"

[[bin]]
name = "quome"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Error handling
thiserror = "2.0"

# Interactive prompts
inquire = "0.7"

# Terminal output
colored = "2.0"
indicatif = "0.17"
tabled = { version = "0.17", features = ["ansi"] }

# Utilities
dirs = "5.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
http = "1"
bytes = "1.11.1"
percent-encoding = "2"
url = "2"
toml = "1"
tiny_http = "0.12"
gethostname = "0.5"
tar = { version = "0.4", default-features = false }
tempfile = "3"
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
# Machine agent (quome models serve): WebSocket tunnel, yamux, one HTTP/1.1 request per stream
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
yamux = "0.14"
tokio-util = { version = "0.7", features = ["compat"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }
hyper = { version = "1", features = ["client"] }

[profile.release]
lto = "fat"
opt-level = "z"
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
