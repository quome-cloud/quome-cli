<svg viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quome CLI: an astronaut quokka holding a command prompt (a command line)">
<style>
/* Motion of the qugit mark, as approved in the 2026-11-07 mockup: the source of truth for the
   animation (classes referenced by the SVGs in this folder). Everything sits behind
   prefers-reduced-motion: no-preference; with reduced motion the mark is a still. */

@media (prefers-reduced-motion: no-preference) {
  .qm-flow { animation: qm-flow 1.6s linear infinite; }
  .qm-beacon { animation: qm-beacon 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .qm-bob { animation: qm-bob 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
  .qm-eyes { animation: qm-blink 5.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
}

@keyframes qm-flow { to { stroke-dashoffset: -14; } }

@keyframes qm-beacon { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.2); } }

@keyframes qm-bob { 0%, 100% { transform: translateY(0) rotate(-0.4deg); } 50% { transform: translateY(-3px) rotate(0.4deg); } }

@keyframes qm-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }

@media (prefers-reduced-motion: no-preference) {
  .qm-float { animation: qm-float 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 60%; }
  .qm-flame { animation: qm-flame 0.5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0; }
}

@keyframes qm-float { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-6px) rotate(1deg); } }

@keyframes qm-flame { from { transform: scaleY(0.7); opacity: .7; } to { transform: scaleY(1.15); opacity: 1; } }

@media (prefers-reduced-motion: no-preference) {
  .qm-ring { animation: qm-ring 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .qm-ring2 { animation: qm-ring 1.8s ease-out .4s infinite; transform-box: fill-box; transform-origin: center; }
  .qm-swing { animation: qm-swing 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
  .qm-glint { animation: qm-glint 2.8s ease-in-out infinite; }
  .qm-led { animation: qm-led 1.6s steps(1) infinite; }
  .qm-led2 { animation: qm-led 1.6s steps(1) .53s infinite; }
  .qm-led3 { animation: qm-led 1.6s steps(1) 1.06s infinite; }
}
@keyframes qm-ring { 0% { opacity: .9; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.35); } }
@keyframes qm-swing { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
@keyframes qm-glint { 0%,70%,100% { opacity: .25; } 80% { opacity: .9; } }
@keyframes qm-led { 0%,33% { opacity: 1; } 34%,100% { opacity: .25; } }

@media (prefers-reduced-motion: no-preference) {
  .qm-spin { animation: qm-spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
  .qm-scanx { animation: qm-scanx 2.4s ease-in-out infinite alternate; }
  .qm-scany { animation: qm-scany 2.4s ease-in-out infinite alternate; }
}
@keyframes qm-spin { to { transform: rotate(360deg); } }
@keyframes qm-scanx { from { transform: translateX(0); } to { transform: translateX(88px); } }
@keyframes qm-scany { from { transform: translateY(0); } to { transform: translateY(64px); } }
</style>
<g transform="translate(34,18)"><g class="qm-float">
<g transform="translate(-26,0)">
