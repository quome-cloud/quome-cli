name: secret-scan

# gitleaks (pinned, checksum-verified). Push and pull request: scan only the commits the event adds.
# Weekly (and on demand): scan the full history. A finding fails the job; the report shows the rule,
# file and commit with the secret redacted. False positives go in .gitleaks.toml with a comment per
# rule; never allowlist a real secret (rotate it instead).

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore gitleaks from the cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: Install gitleaks
        run: |
          set -euo pipefail
          t="$HOME/.cache/gitleaks/gitleaks.tgz"
          if [ ! -f "$t" ]; then
            # Only the first run for a version downloads; the cache holds it after that.
            mkdir -p "$(dirname "$t")"
            curl -fsSL --retry 5 --retry-all-errors -o "$t" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          fi
          echo "${GITLEAKS_SHA256}  $t" | sha256sum -c -
          sudo tar -xzf "$t" -C /usr/local/bin gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          range=""
          case "$EVENT" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="-1 ${PUSH_AFTER}"   # new branch or rewritten history: the tip commit
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi ;;
          esac                              # schedule / manual: full history
          echo "scanning: ${range:-full history}"
          if [ -n "$range" ]; then
            gitleaks git --redact -v --no-banner --exit-code 1 --log-opts="$range" .
          else
            gitleaks git --redact -v --no-banner --exit-code 1 .
          fi
